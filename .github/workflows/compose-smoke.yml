name: Compose smoke test

on:
  push:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "docker/**"
      - "frontend/**"
      - "scripts/prepare-compose.*"
      - "scripts/build_frontend_dist.sh"
      - ".env.docker.example"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "docker/**"
      - "frontend/**"
      - ".env.docker.example"
      - ".github/workflows/compose-smoke.yml"

concurrency:
  group: compose-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.docker.example .env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist
        env:
          VITE_IS_DOCKER: "true"
        run: ./scripts/build_frontend_dist.sh

      - name: Validate compose file
        run: docker compose config

      - name: Pull prebuilt images
        run: docker compose pull app docreader postgres redis || true

      - name: Start core stack
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "app healthy after ${i} attempts"
              exit 0
            fi
            docker compose ps
            sleep 10
          done
          echo "app did not become healthy in time"
          docker compose logs --tail=200 app docreader postgres
          exit 1

      - name: Check frontend responds
        run: curl -sf -o /dev/null -w "%{http_code}\n" http://localhost/ | grep -E '200|301|302'

      - name: Tear down
        if: always()
        run: docker compose down -v
